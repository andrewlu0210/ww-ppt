[package]
name = "ww-ppt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Want-Point presentation editor"

[lib]
name = "ww_ppt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ppt-fonts.workspace = true
ppt-model.workspace = true
ppt-ooxml.workspace = true
ppt-video.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSRange", "NSArray", "NSLocale"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSpellChecker"] }
